<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ronsaupedia — The lore of Bal'lazath legends</title>
  <meta name="description" content="The lore of Bal'lazath legends">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at top, #2a1d14 0%, #0f0b08 70%);
      color: #e9dcc3; font-family: Georgia, "Times New Roman", serif;
      padding: 2rem; text-align: center;
    }
    main { max-width: 40rem; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 .5rem;
      letter-spacing: .08em; color: #d9a85b;
      text-shadow: 0 0 24px rgba(217,168,91,.35);
    }
    .rule { width: 8rem; height: 1px; margin: 1.5rem auto;
      background: linear-gradient(90deg, transparent, #d9a85b, transparent); }
    p { font-size: 1.2rem; line-height: 1.6; font-style: italic; opacity: .85; }
  </style>
</head>
<body>
  <main>
    <h1>Ronsaupedia</h1>
    <div class="rule"></div>
    <p>The lore of Bal'lazath legends</p>
  </main>
</body>
</html>
